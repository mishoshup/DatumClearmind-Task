<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DatumClearmind | Task Manager</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />

    <!-- Optional: Custom styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container py-5">
      <!-- Page Title -->
      <header class="mb-4">
        <h1 class="text-black">Task Manager</h1>
      </header>

      <!-- Filter & Refresh Controls -->
      <section class="d-flex align-items-center gap-2 mb-4">
        <!-- Dropdown for filtering tasks by status -->
        <select
          id="filterSelect"
          class="form-select w-auto"
          aria-label="Filter task list"
        >
          <option value="all">All Tasks</option>
          <option value="completed">Completed Tasks</option>
          <option value="incomplete">Incomplete Tasks</option>
        </select>

        <!-- Refresh button to reload task list -->
        <button id="refreshBtn" class="btn btn-outline-primary">Refresh</button>
      </section>

      <!-- Loading Indicator (shown while fetching tasks) -->
      <div id="loadingSpinner" class="d-flex justify-content-center">
        <div class="spinner-border text-primary m-5" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Dynamic Task List -->
      <section id="taskList" class="list-group shadow-sm"></section>
    </main>

    <!-- Bootstrap Modal for Task Details -->
    <div class="modal fade" id="taskDetailsModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content rounded-3 shadow">
          <div class="modal-header">
            <h5 class="modal-title" id="taskDetailsLabel">Task Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <!-- Modal body populated dynamically via JS -->
          <div class="modal-body" id="taskDetailsBody"></div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>

    <!-- Your custom logic -->
    <script src="script.js"></script>
  </body>
</html>
